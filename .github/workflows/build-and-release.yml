name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches: [ 3.0 ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Read version from application.yml
        run: |
          VERSION=$(grep '^version:' src/main/resources/application.yml | awk '{print $2}' | tr -d '[:space:]')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "App version: $VERSION"

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/simple_sq_music_plus_mod:latest
            ghcr.io/${{ github.actor }}/simple_sq_music_plus_mod:v${{ env.APP_VERSION }}
          provenance: false
          labels: |
            org.opencontainers.image.title=Simple SQ Music Plus Mod
            org.opencontainers.image.version=v${{ env.APP_VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      
