version: '3.8'

# 使用 GitHub Container Registry (ghcr.io) 镜像的部署文件
# 镜像地址: ghcr.io/kennysoul/simple_sq_music_plus_mod:latest
# 支持 linux/amd64 和 linux/arm64 多架构，Docker 会自动选择匹配当前服务器的版本
#
# 使用前请修改:
#   1. volumes 中的音乐目录路径（./music 改为实际路径，如 /mnt/hdd/sqmusic）
#   2. 如需修改端口，调整 sqmusic_web 的 ports 映射
#   3. 建议修改 MYSQL_ROOT_PASSWORD 和 DB_PASSWORD 为强密码
#
# 首次安装（单文件）:
#   curl -o docker-compose.yml https://raw.githubusercontent.com/kennysoul/simple_sq_music_plus_mod/3.0/docker-compose.yml
#   docker compose pull && docker compose up -d

services:
  sqmusic_main:
    image: ghcr.io/kennysoul/simple_sq_music_plus_mod:latest
    container_name: sqmusic_mod_main
    command: ["sh", "-c", "java -Xms256m -Xmx512m -jar app.jar"]
    environment:
      - DB_IP=mysql
      - DB_PORT=3306
      - DB_NAME=sqmusicv3
      - DB_USERNAME=root
      - DB_PASSWORD=sqmusicv3password
    volumes:
      - ./music:/music
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sq-mod-network
    expose:
      - "8099"
    restart: always

  sqmusic_web:
    image: ghcr.io/kennysoul/simple_sq_music_plus_web_mod:latest
    container_name: sqmusic_mod_web
    ports:
      - "8096:80"
    networks:
      - sq-mod-network
    depends_on:
      - sqmusic_main
    restart: always

  mysql:
    image: mysql:5.7
    container_name: sqmusic_mod_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: sqmusicv3password
      MYSQL_DATABASE: sqmusicv3
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - sq-mod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psqmusicv3password"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

networks:
  sq-mod-network:
    driver: bridge