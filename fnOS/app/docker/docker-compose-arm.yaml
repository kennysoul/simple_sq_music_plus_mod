version: '3.8'

services:
  sqmusic_main:
    image: ghcr.io/kennysoul/simple_sq_music_plus_mod:latest
    container_name: sqmusic_mod_main
    environment:
      - DB_IP=mysql
      - DB_PORT=3306
      - DB_NAME=sqmusicv3
      - DB_USERNAME=root
      - DB_PASSWORD=sqmusicv3password
    volumes:
      - ./data:/music
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sq-mod-network
    expose:
      - "8099"
    restart: always

  sqmusic_web:
    image: ghcr.io/kennysoul/simple_sq_music_plus_web_mod:latest
    container_name: sqmusic_mod_web
    ports:
      - "8099:80"
    networks:
      - sq-mod-network
    depends_on:
      - sqmusic_main
    restart: always

  mysql:
    image: pistar/mysql-arm:hf-5.7.25
    container_name: sqmusic_mod_mysql
    environment:
      MYSQL_ROOT_PASSWORD: sqmusicv3password
      MYSQL_DATABASE: sqmusicv3
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - sq-mod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

networks:
  sq-mod-network:
    driver: bridge




